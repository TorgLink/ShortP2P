<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img">
  <title>sec5-server</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="20" y="12" width="720" height="70" rx="8" ry="8" fill="#E7EEF7" stroke="#B9CCE1" stroke-width="1"/>
  <text x="36" y="34" text-anchor="start" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#2B4C7E">DÉFINITION</text>
  <text x="36" y="54" text-anchor="start" font-family="DejaVu Sans" font-size="10.5" font-weight="normal" fill="#243B5A">Le serveur relaie des blocs chiffrés opaques via HTTPS ; entre humains le codec v2</text>
  <text x="36" y="70" text-anchor="start" font-family="DejaVu Sans" font-size="10.5" font-weight="normal" fill="#243B5A">est privilégié, les bots utilisent toujours v1.</text>
  <rect x="20" y="96" width="220" height="104" rx="8" ry="8" fill="#EBF1F9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="20" y="96" width="220" height="24" rx="8" ry="8" fill="#3E6DB5" stroke="#3E6DB5" stroke-width="1"/>
  <text x="130.0" y="112" text-anchor="middle" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#FFFFFF">TLS + JWT</text>
  <text x="130.0" y="138" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">transport sécurisé</text>
  <text x="130.0" y="152" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">le serveur ne voit rien</text>
  <rect x="270" y="96" width="220" height="104" rx="8" ry="8" fill="#F1EDF9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="270" y="96" width="220" height="24" rx="8" ry="8" fill="#7A5FB5" stroke="#7A5FB5" stroke-width="1"/>
  <text x="380.0" y="112" text-anchor="middle" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#FFFFFF">CODEC V2</text>
  <text x="380.0" y="138" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">RSA une fois pour établir</text>
  <text x="380.0" y="152" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">puis AES-256-GCM + nonce 12 o</text>
  <rect x="520" y="96" width="220" height="104" rx="8" ry="8" fill="#EAF5F0" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="520" y="96" width="220" height="24" rx="8" ry="8" fill="#3F9A6E" stroke="#3F9A6E" stroke-width="1"/>
  <text x="630.0" y="112" text-anchor="middle" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#FFFFFF">CODEC V1</text>
  <text x="630.0" y="138" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">clé AES neuve par message</text>
  <text x="630.0" y="152" text-anchor="middle" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#2A3546">clé enveloppée en RSA (bots)</text>
  <line x1="242" y1="160" x2="268" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="160" x2="518" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="218" width="430" height="230" rx="8" ry="8" fill="#F2F5F9" stroke="#C4CFDD" stroke-width="1"/>
  <text x="36" y="242" text-anchor="start" font-family="DejaVu Sans" font-size="10.5" font-weight="700" fill="#2B4C7E">EXEMPLE</text>
  <text x="36" y="262" text-anchor="start" font-family="DejaVu Sans Mono" font-size="9.5" font-weight="normal" fill="#2A3546">v2 kind 1: establish RSA + AES-256-GCM</text>
  <text x="36" y="277" text-anchor="start" font-family="DejaVu Sans Mono" font-size="9.5" font-weight="normal" fill="#2A3546">v2 kind 2: SessionId | nonce(12) | CT</text>
  <text x="36" y="292" text-anchor="start" font-family="DejaVu Sans Mono" font-size="9.5" font-weight="normal" fill="#2A3546">v2 kind 4/5: probe ack / rekey</text>
  <text x="36" y="307" text-anchor="start" font-family="DejaVu Sans Mono" font-size="9.5" font-weight="normal" fill="#2A3546">v1: RSA-OAEP-SHA256(key||nonce) | CT</text>
  <rect x="470" y="218" width="270" height="230" rx="8" ry="8" fill="#FBECEA" stroke="#E7BCB6" stroke-width="1"/>
  <text x="486" y="242" text-anchor="start" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#B3261E">IMPORTANT</text>
  <text x="486" y="262" text-anchor="start" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#2E7D32">✓</text>
  <text x="500" y="262" text-anchor="start" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#3A2A28">le serveur ne peut pas déchiffrer les</text>
  <text x="500" y="276" text-anchor="start" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#3A2A28">corps</text>
  <text x="486" y="295" text-anchor="start" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#C62828">✗</text>
  <text x="500" y="295" text-anchor="start" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#3A2A28">les bots ne passent jamais en v2</text>
  <text x="486" y="314" text-anchor="start" font-family="DejaVu Sans" font-size="10" font-weight="700" fill="#2E7D32">✓</text>
  <text x="500" y="314" text-anchor="start" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#3A2A28">le client épingle l&#x27;empreinte du</text>
  <text x="500" y="328" text-anchor="start" font-family="DejaVu Sans" font-size="9.5" font-weight="normal" fill="#3A2A28">certificat</text>
</svg>
