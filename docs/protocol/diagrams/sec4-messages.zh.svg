<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img">
  <title>sec4-messages</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="20" y="12" width="720" height="70" rx="8" ry="8" fill="#E7EEF7" stroke="#B9CCE1" stroke-width="1"/>
  <text x="36" y="34" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#2B4C7E">定义</text>
  <text x="36" y="54" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">加密内部传递的是 ChatWire 帧：魔数 S2P1（4 字节）、</text>
  <text x="36" y="70" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">类型字节、各字段。</text>
  <rect x="20" y="96" width="220" height="104" rx="8" ry="8" fill="#EBF1F9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="20" y="96" width="220" height="24" rx="8" ry="8" fill="#3E6DB5" stroke="#3E6DB5" stroke-width="1"/>
  <text x="130.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">魔数 S2P1</text>
  <text x="130.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">帧的 ASCII 头</text>
  <text x="130.0" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">解析器据此识别格式</text>
  <rect x="270" y="96" width="220" height="104" rx="8" ry="8" fill="#F1EDF9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="270" y="96" width="220" height="24" rx="8" ry="8" fill="#7A5FB5" stroke="#7A5FB5" stroke-width="1"/>
  <text x="380.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">类型字节 0x01..0x0A</text>
  <text x="380.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">文本 / 图片 / 文件</text>
  <text x="380.0" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">词典 / 探测 / 资料</text>
  <rect x="520" y="96" width="220" height="104" rx="8" ry="8" fill="#EAF5F0" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="520" y="96" width="220" height="24" rx="8" ry="8" fill="#3F9A6E" stroke="#3F9A6E" stroke-width="1"/>
  <text x="630.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">字段</text>
  <text x="630.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">长度为小端序</text>
  <text x="630.0" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">数据字节在最后</text>
  <line x1="242" y1="160" x2="268" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="160" x2="518" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="218" width="430" height="230" rx="8" ry="8" fill="#F2F5F9" stroke="#C4CFDD" stroke-width="1"/>
  <text x="36" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#2B4C7E">示例</text>
  <text x="36" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">53 32 50 31 01 05 00 00 00 48 65 6C 6C 6F</text>
  <text x="36" y="277" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546"> S2P1      kind len LE      H  e  l  l  o</text>
  <text x="36" y="292" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x04/0x05: JSON | 0x06: about+avatar</text>
  <text x="36" y="307" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x09: dict payload | 0x0A: ver|kind|chal(8)</text>
  <rect x="470" y="218" width="270" height="230" rx="8" ry="8" fill="#FBECEA" stroke="#E7BCB6" stroke-width="1"/>
  <text x="486" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#B3261E">注意</text>
  <text x="486" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#2E7D32">√</text>
  <text x="500" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">无魔数的原始 UTF-8 仍按文本接受</text>
  <text x="486" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#C62828">×</text>
  <text x="500" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">ACK 0xAC / NACK 0xAD 不是</text>
  <text x="500" y="295" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">ChatWire 帧</text>
  <text x="486" y="314" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#2E7D32">√</text>
  <text x="500" y="314" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">每种类型一页见 docs/messages</text>
</svg>
