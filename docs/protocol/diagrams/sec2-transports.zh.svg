<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img">
  <title>sec2-transports</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="20" y="12" width="720" height="70" rx="8" ry="8" fill="#E7EEF7" stroke="#B9CCE1" stroke-width="1"/>
  <text x="36" y="34" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#2B4C7E">定义</text>
  <text x="36" y="54" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">相同的逻辑帧可通过多种传输方式传递；</text>
  <text x="36" y="70" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">只有到 Messenger Server 的连接始终使用 HTTPS。</text>
  <rect x="20" y="96" width="167" height="104" rx="8" ry="8" fill="#EBF1F9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="20" y="96" width="167" height="24" rx="8" ry="8" fill="#3E6DB5" stroke="#3E6DB5" stroke-width="1"/>
  <text x="103.5" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">UDP 17500</text>
  <text x="103.5" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">聊天数据通道</text>
  <text x="103.5" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">握手 + 加密 0x02</text>
  <rect x="204" y="96" width="167" height="104" rx="8" ry="8" fill="#F1EDF9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="204" y="96" width="167" height="24" rx="8" ry="8" fill="#7A5FB5" stroke="#7A5FB5" stroke-width="1"/>
  <text x="287.5" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">UDP 17501/17502</text>
  <text x="287.5" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">在线通告 / 邀请</text>
  <text x="287.5" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">明文控制</text>
  <rect x="388" y="96" width="167" height="104" rx="8" ry="8" fill="#EAF5F0" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="388" y="96" width="167" height="24" rx="8" ry="8" fill="#3F9A6E" stroke="#3F9A6E" stroke-width="1"/>
  <text x="471.5" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">UDP 17890</text>
  <text x="471.5" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">发现 / gossip</text>
  <text x="471.5" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">明文控制</text>
  <rect x="572" y="96" width="167" height="104" rx="8" ry="8" fill="#EBF1F9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="572" y="96" width="167" height="24" rx="8" ry="8" fill="#3E6DB5" stroke="#3E6DB5" stroke-width="1"/>
  <text x="655.5" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">BLE / mesh</text>
  <text x="655.5" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">相同逻辑帧</text>
  <text x="655.5" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">启用时</text>
  <line x1="189" y1="160" x2="202" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="373" y1="160" x2="386" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="557" y1="160" x2="570" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="218" width="430" height="230" rx="8" ry="8" fill="#F2F5F9" stroke="#C4CFDD" stroke-width="1"/>
  <text x="36" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#2B4C7E">示例</text>
  <text x="36" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x30 invite    | 0x31 presence</text>
  <text x="36" y="277" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x01 handshake | 0x04 setup req</text>
  <text x="36" y="292" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x02 cipher    | discovery: 17890</text>
  <text x="36" y="307" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">BLE / mesh: same logical frames</text>
  <text x="36" y="322" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">server: HTTPS/TLS + JWT always</text>
  <rect x="470" y="218" width="270" height="230" rx="8" ry="8" fill="#FBECEA" stroke="#E7BCB6" stroke-width="1"/>
  <text x="486" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#B3261E">注意</text>
  <text x="486" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#2E7D32">√</text>
  <text x="500" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">聊天内容只在 0x02 加密内</text>
  <text x="486" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#C62828">×</text>
  <text x="500" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">邀请 / 在线通告 / gossip 不加密</text>
  <text x="486" y="300" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#C62828">×</text>
  <text x="500" y="300" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">与服务器连接始终 HTTPS + JWT</text>
</svg>
