<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img">
  <title>Уровни протокола ShortP2P</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="30" width="680" height="50" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="380.0" y="48" text-anchor="middle" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#12233A">Приложение</text>
  <text x="380.0" y="66" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10" fill="#243447">Типы сообщений ChatWire / ACK-NACK мессенджера</text>
  <rect x="40" y="100" width="680" height="50" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="380.0" y="118" text-anchor="middle" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#12233A">Шифрование сессии</text>
  <text x="380.0" y="136" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10" fill="#243447">Рукопожатие RSA-OAEP, затем AES-CBC + HMAC (P2P)</text>
  <rect x="40" y="170" width="680" height="50" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="380.0" y="188" text-anchor="middle" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#12233A">Транспорт</text>
  <text x="380.0" y="206" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10" fill="#243447">UDP / BLE / mesh  |  HTTPS TLS до Messenger Server</text>
  <rect x="40" y="240" width="680" height="50" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="380.0" y="258" text-anchor="middle" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#12233A">Идентичность</text>
  <text x="380.0" y="276" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10" fill="#243447">NetworkId 12 Б  |  RSA-1024 долгосрочные ключи</text>
  <text x="40" y="320" font-family="DejaVu Sans" font-size="11" fill="#486581">Логический стек (не уровни ОС). Подробности: docs/encryption, docs/messages.</text>
</svg>
