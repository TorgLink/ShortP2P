<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img">
  <title>sec6-discovery</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="20" y="12" width="720" height="70" rx="8" ry="8" fill="#E7EEF7" stroke="#B9CCE1" stroke-width="1"/>
  <text x="36" y="34" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#2B4C7E">定义</text>
  <text x="36" y="54" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">发现帧是明文控制流量：寻找对等端和路由，</text>
  <text x="36" y="70" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="normal" fill="#243B5A">从不携带聊天秘密。</text>
  <rect x="20" y="96" width="220" height="104" rx="8" ry="8" fill="#EBF1F9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="20" y="96" width="220" height="24" rx="8" ry="8" fill="#3E6DB5" stroke="#3E6DB5" stroke-width="1"/>
  <text x="130.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">探测 / 应答 0x40/0x41</text>
  <text x="130.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">局域网内谁可达</text>
  <rect x="270" y="96" width="220" height="104" rx="8" ry="8" fill="#F1EDF9" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="270" y="96" width="220" height="24" rx="8" ry="8" fill="#7A5FB5" stroke="#7A5FB5" stroke-width="1"/>
  <text x="380.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">路由 0x42/0x43</text>
  <text x="380.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">到对等端的路径表</text>
  <rect x="520" y="96" width="220" height="104" rx="8" ry="8" fill="#EAF5F0" stroke="#9AA7B8" stroke-width="1"/>
  <rect x="520" y="96" width="220" height="24" rx="8" ry="8" fill="#3F9A6E" stroke="#3F9A6E" stroke-width="1"/>
  <text x="630.0" y="112" text-anchor="middle" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#FFFFFF">资料 0x44/0x45</text>
  <text x="630.0" y="138" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">关于我 + 头像</text>
  <text x="630.0" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">仅本地保存</text>
  <line x1="242" y1="160" x2="268" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="492" y1="160" x2="518" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="218" width="430" height="230" rx="8" ry="8" fill="#F2F5F9" stroke="#C4CFDD" stroke-width="1"/>
  <text x="36" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="10.5" font-weight="700" fill="#2B4C7E">示例</text>
  <text x="36" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x40 probe   | 0x41 ack</text>
  <text x="36" y="277" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x42 routes  | 0x43 reply</text>
  <text x="36" y="292" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">0x44 profile | 0x45 reply (about+avatar)</text>
  <text x="36" y="307" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#2A3546">RELAY 0x22: outer clear, inner opaque</text>
  <rect x="470" y="218" width="270" height="230" rx="8" ry="8" fill="#FBECEA" stroke="#E7BCB6" stroke-width="1"/>
  <text x="486" y="242" text-anchor="start" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#B3261E">注意</text>
  <text x="486" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#2E7D32">√</text>
  <text x="500" y="262" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">资料只缓存在本地</text>
  <text x="486" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#C62828">×</text>
  <text x="500" y="281" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">不要把控制流量当成聊天内容</text>
  <text x="486" y="300" text-anchor="start" font-family="Microsoft YaHei" font-size="10" font-weight="700" fill="#2E7D32">√</text>
  <text x="500" y="300" text-anchor="start" font-family="Microsoft YaHei" font-size="9.5" font-weight="normal" fill="#3A2A28">RELAY 内可携带不透明的 0x02</text>
</svg>
