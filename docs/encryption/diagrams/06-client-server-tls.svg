<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="230" viewBox="0 0 740 230" role="img">
  <title>Client to Server transport (TLS + JWT)</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="150" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="115.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Client</text>
  <text x="115.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">HTTPS</text>
  <text x="115.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">cert pin SHA-256</text>
  <rect x="260" y="60" width="180" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">TLS channel</text>
  <text x="350.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">Bearer JWT</text>
  <text x="350.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">HMAC-SHA256</text>
  <rect x="510" y="60" width="170" height="70" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="595.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Messenger API</text>
  <text x="595.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">opaque E2E fields</text>
  <text x="595.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">no body decrypt</text>
  <line x1="190" y1="95" x2="260" y2="95" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225.0" y="89.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">TLS</text>
  <line x1="440" y1="95" x2="510" y2="95" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475.0" y="89.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">JWT</text>
  <text x="40" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Protects transport only. Chat secrecy is Schemes 7-9.</text>
</svg>
