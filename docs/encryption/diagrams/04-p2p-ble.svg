<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img">
  <title>P2P over BLE</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="170" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="125.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">App plaintext</text>
  <text x="125.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChatWire</text>
  <rect x="260" y="50" width="180" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Same Sch.1+2</text>
  <text x="350.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">0x01 / 0x04 / 0x02</text>
  <rect x="500" y="50" width="180" height="70" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="590.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">BLE transport</text>
  <text x="590.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">RFCOMM/GATT</text>
  <text x="590.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">MAC addressing</text>
  <rect x="260" y="170" width="180" height="60" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Peer decrypt</text>
  <text x="350.0" y="206" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">P2PSession</text>
  <line x1="210" y1="85" x2="260" y2="85" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="85" x2="500" y2="85" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="120" x2="350" y2="170" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Identity ads / invite RSA public JSON remain clear on BLE.</text>
</svg>
