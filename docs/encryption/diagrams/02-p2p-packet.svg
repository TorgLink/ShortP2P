<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img">
  <title>P2P symmetric packet (AES-CBC + HMAC)</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="30" y="50" width="130" height="80" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="95.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Plaintext</text>
  <text x="95.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChatWire / ACK</text>
  <text x="95.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">optional Chunk</text>
  <rect x="200" y="50" width="140" height="80" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="270.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">AES-128-CBC</text>
  <text x="270.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">PKCS7</text>
  <text x="270.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">IV = RNG 16</text>
  <rect x="380" y="50" width="150" height="80" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="455.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">HMAC-SHA256</text>
  <text x="455.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">macKey</text>
  <text x="455.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">tag = first 16 B</text>
  <rect x="570" y="50" width="130" height="80" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="635.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Packet</text>
  <text x="635.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">IV||CT||TAG</text>
  <text x="635.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">&lt;= 1024 B</text>
  <rect x="300" y="180" width="160" height="60" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="380.0" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Wire 0x02</text>
  <text x="380.0" y="216" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">0x02 || packet</text>
  <line x1="160" y1="90" x2="200" y2="90" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="90" x2="380" y2="90" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="90" x2="570" y2="90" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="635" y1="130" x2="380" y2="180" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="507.5" y="149.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">frame</text>
  <text x="30" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Decrypt inverse: strip 0x02, verify tag (constant-time), AES-CBC decrypt, unchunk.</text>
</svg>
