<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="230" viewBox="0 0 740 230" role="img">
  <title>Client to Server to Bot</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="140" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="110.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Client</text>
  <text x="110.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChatWire</text>
  <text x="110.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">v1 encrypt</text>
  <rect x="250" y="60" width="200" height="70" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Server</text>
  <text x="350.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">opaque store</text>
  <text x="350.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">TLS+JWT only</text>
  <rect x="520" y="60" width="160" height="70" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="600.0" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Bot</text>
  <text x="600.0" y="96" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">v1 decrypt</text>
  <text x="600.0" y="110" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">bot RSA priv</text>
  <line x1="180" y1="95" x2="250" y2="95" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215.0" y="89.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">v1 E2E</text>
  <line x1="450" y1="95" x2="520" y2="95" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485.0" y="89.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">v1 E2E</text>
  <text x="40" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Reply path mirrors: Bot --v1--&gt; Server --v1--&gt; Client.</text>
</svg>
