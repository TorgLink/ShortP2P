<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img">
  <title>Ancillary crypto (non-chat wire)</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="80" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="140.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Safety number</text>
  <text x="140.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">SHA-256(mod||exp)</text>
  <text x="140.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">emoji glyphs</text>
  <rect x="280" y="50" width="220" height="80" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="390.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Profile .tlp backup</text>
  <text x="390.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">PBKDF2-SHA256 600k</text>
  <text x="390.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChaCha20-Poly1305</text>
  <rect x="540" y="50" width="180" height="80" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="630.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Identity RSA</text>
  <text x="630.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">RSA-1024</text>
  <text x="630.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">register keys</text>
  <text x="40" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Not used as the chat packet cipher path.</text>
</svg>
