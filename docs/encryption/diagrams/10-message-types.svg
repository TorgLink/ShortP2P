<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290" role="img">
  <title>Message types inside encrypted channels</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
