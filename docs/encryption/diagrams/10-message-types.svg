      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <text x="40" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#12233A">ChatWire magic S2P1 — plaintext before Sch.2/7/8/9</text>
