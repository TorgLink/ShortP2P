<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290" viewBox="0 0 740 290" role="img">
  <title>Server payload v2 (session AES-GCM)</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="140" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="90.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">ChatWire</text>
  <text x="90.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">+ probeToken</text>
  <text x="90.0" y="90" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">on establish</text>
  <rect x="190" y="40" width="160" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="270.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">AES-256-GCM</text>
  <text x="270.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">nonce RNG 12</text>
  <text x="270.0" y="90" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">tag 16</text>
  <rect x="380" y="40" width="170" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="465.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">RSA wrap once</text>
  <text x="465.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">OAEP-SHA256</text>
  <text x="465.0" y="90" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">SessionId||key</text>
  <rect x="580" y="40" width="130" height="70" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="645.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Blob v2</text>
  <text x="645.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">kind 1/2/4/5</text>
  <text x="645.0" y="90" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">Base64</text>
  <rect x="300" y="160" width="200" height="55" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="400.0" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">TLS to Server to Peer</text>
  <text x="400.0" y="196" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">Scheme 6</text>
  <line x1="160" y1="75" x2="190" y2="75" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="75" x2="380" y2="75" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365.0" y="69.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">kind1</text>
  <line x1="550" y1="75" x2="580" y2="75" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="110" x2="400" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="20" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Later data kind=2 uses SessionId + AES-GCM only (no RSA).</text>
</svg>
