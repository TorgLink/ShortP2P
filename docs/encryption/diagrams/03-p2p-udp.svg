<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img">
  <title>P2P over UDP</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="160" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="120.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">App</text>
  <text x="120.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChatWire</text>
  <text x="120.0" y="90" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">session setup</text>
  <rect x="260" y="40" width="180" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Crypto Sch.1+2</text>
  <text x="350.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">0x01/0x04/0x02</text>
  <rect x="500" y="40" width="180" height="70" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="590.0" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">UDP 17500</text>
  <text x="590.0" y="76" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">data port</text>
  <rect x="260" y="160" width="180" height="70" rx="6" ry="6" fill="#F7F1E8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Optional RELAY</text>
  <text x="350.0" y="196" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">0x22 outer clear</text>
  <text x="350.0" y="210" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">inner 0x02 opaque</text>
  <rect x="500" y="160" width="180" height="70" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="590.0" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Peer App</text>
  <text x="590.0" y="196" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">decrypt Sch.2</text>
  <line x1="200" y1="75" x2="260" y2="75" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="75" x2="500" y2="75" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="110" x2="590" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="110" x2="350" y2="160" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350.0" y="129.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334E68">or via</text>
  <text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Invite 17502 / presence 17501 / discovery 17890 stay plaintext.</text>
</svg>
