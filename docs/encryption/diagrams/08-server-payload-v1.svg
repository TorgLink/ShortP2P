<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img">
  <title>Server payload v1 (hybrid AES-GCM + RSA)</title>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="140" height="70" rx="6" ry="6" fill="#E8F1F8" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="110.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">Plain</text>
  <text x="110.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">ChatWire/blob</text>
  <rect x="220" y="50" width="170" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="305.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">AES-256-GCM</text>
  <text x="305.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">key32 + nonce12</text>
  <text x="305.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">RNG per message</text>
  <rect x="430" y="50" width="180" height="70" rx="6" ry="6" fill="#D9E8F5" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="520.0" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">RSA-OAEP-SHA256</text>
  <text x="520.0" y="86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">wrap key||nonce</text>
  <text x="520.0" y="100" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">recipient pub</text>
  <rect x="250" y="170" width="200" height="55" rx="6" ry="6" fill="#E6F4EA" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="350.0" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#12233A">v1 blob Base64 / TLS</text>
  <text x="350.0" y="206" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="10" fill="#243447">server opaque</text>
  <line x1="180" y1="85" x2="220" y2="85" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="85" x2="430" y2="85" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="120" x2="350" y2="170" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#486581">Used for bots and as blob fallback.</text>
</svg>
